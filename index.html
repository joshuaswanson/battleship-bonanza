<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E2A47" />
    <title>Battleship Bonanza</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div class="wipe" id="wipe" aria-hidden="true">
      <svg viewBox="0 0 1600 1000" preserveAspectRatio="none">
        <path class="wipe-back" d="M140 0 C220 120 60 230 160 360 C260 490 80 610 170 740 C250 860 120 940 160 1000 L1440 1000 C1500 900 1380 820 1460 700 C1540 580 1360 470 1450 340 C1530 220 1400 110 1460 0 Z" />
        <path class="wipe-front" d="M220 0 C300 140 140 250 240 380 C340 510 160 630 250 760 C330 880 200 950 240 1000 L1380 1000 C1440 910 1300 830 1390 710 C1470 590 1300 480 1390 350 C1470 230 1330 120 1400 0 Z" />
        <path class="wipe-edge" d="M1400 0 C1330 120 1470 230 1390 350 C1300 480 1470 590 1390 710 C1300 830 1440 910 1380 1000" />
        <path class="wipe-edge" d="M220 0 C300 140 140 250 240 380 C340 510 160 630 250 760 C330 880 200 950 240 1000" />
        <path class="wipe-foam" d="M1400 0 C1330 120 1470 230 1390 350 C1300 480 1470 590 1390 710 C1300 830 1440 910 1380 1000" />
        <path class="wipe-foam" d="M220 0 C300 140 140 250 240 380 C340 510 160 630 250 760 C330 880 200 950 240 1000" />
      </svg>
    </div>

    <div id="ui">
      <section id="screen-title" class="screen">
        <div class="title-logo" data-logo="3d"></div>
        <a class="title-credit" href="https://joshuaswanson.github.io" target="_blank" rel="noopener" data-i18n="credit">by Joshua Swanson</a>
        <div class="mobile-note">
          <p class="mobile-title" data-i18n="mobileTitle"></p>
          <p data-i18n="mobileBody"></p>
        </div>
        <div class="title-menu">
          <button id="btn-play" class="btn btn-big btn-play" data-i18n="play">Play</button>
          <div class="title-row">
            <button id="btn-howto" class="btn" data-i18n="howto">How to play</button>
            <button id="btn-settings" class="btn" data-i18n="settings">Settings</button>
          </div>
        </div>
      </section>

      <section id="screen-howto" class="screen screen-dim hidden">
        <div class="panel howto">
          <h2 data-i18n="howto">How to play</h2>
          <dl class="howto-keys">
            <div><dt><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></dt><dd data-i18n="drive">Drive</dd></div>
            <div><dt><kbd>Esc</kbd></dt><dd data-i18n="pauseKey">Pause</dd></div>
            <div><dt><kbd>O</kbd></dt><dd data-i18n="firstAttachment">First attachment</dd></div>
            <div><dt><kbd>P</kbd></dt><dd data-i18n="secondAttachment">Second attachment</dd></div>
          </dl>
          <ul class="howto-tips">
            <li data-i18n="tip1"></li>
            <li data-i18n="tip2"></li>
            <li data-i18n="tip3"></li>
            <li data-i18n="tip4"></li>
          </ul>
          <button id="btn-howto-close" class="btn btn-big" data-i18n="gotIt">Got it</button>
        </div>
      </section>

      <section id="screen-settings" class="screen screen-dim hidden">
        <div class="panel panel-narrow settings">
          <h2 data-i18n="settings">Settings</h2>
          <p class="settings-label" data-i18n="language">Language</p>
          <div class="lang-picker" id="lang-picker" role="group" aria-label="Language"></div>
          <button id="btn-settings-close" class="btn btn-big" data-i18n="done">Done</button>
        </div>
      </section>

      <section id="screen-maps" class="screen hidden">
        <div class="maps">
          <header class="maps-head">
            <button id="btn-maps-back" class="btn btn-small" data-i18n="back">Back</button>
            <h2 class="maps-title" data-i18n="pickCourse">Pick a course</h2>
          </header>
          <div class="map-cards" id="map-cards" role="radiogroup"></div>
          <button id="btn-go" class="btn btn-big btn-launch" data-i18n="startRace">Start race</button>
        </div>
      </section>

      <section id="screen-loadout" class="screen hidden">
        <canvas id="preview"></canvas>
        <div class="item-detail" id="item-detail" role="tooltip"></div>
        <div class="yard">
          <div class="stage-col">
            <header class="yard-head">
              <button id="btn-back" class="btn btn-small" data-i18n="back">Back</button>
              <div class="mini-logo" data-logo="3d"></div>
            </header>
            <div class="stage" id="stage">
            </div>
            <div class="boat-card">
              <h2 class="combo" id="combo-name">The Plain Dinghy</h2>
              <div class="boat-card-grid">
                <div class="slots" id="slots"></div>
                <div class="stats" id="stats"></div>
                <label class="field">
                  <span data-i18n="boatName">Boat name</span>
                  <input id="boat-name" maxlength="16" autocomplete="off" spellcheck="false" />
                </label>
                <div class="field">
                  <span data-i18n="paint">Paint</span>
                  <div class="swatches" id="swatches"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="tray-col">
            <aside class="tray">
              <div class="item-groups" id="item-groups"></div>
            </aside>
            <button id="btn-start" class="btn btn-big btn-launch">Start race</button>
          </div>
        </div>
      </section>

      <section id="hud" class="hidden">
        <div class="hud-place">
          <span class="place-num" id="hud-place">1st</span>
          <span class="place-of" id="hud-of">of 6</span>
        </div>
        <div class="hud-lap" id="hud-lap">Lap 1 of 3</div>
        <div class="hud-time" id="hud-time">0:00.0</div>
        <button class="hud-pause" id="btn-pause" aria-label="Pause"><span></span><span></span></button>
        <ul class="hud-feed" id="hud-feed"></ul>
        <div class="hud-center" id="hud-center"></div>
        <div class="hud-warn" id="hud-warn"></div>
        <div class="hud-return" id="hud-return">
          <div class="return-text" data-i18n="returnCourse"></div>
          <div class="return-arrow" id="return-arrow"></div>
        </div>
        <div class="hud-reticle" id="hud-reticle"></div>
        <div class="hud-abilities" id="hud-slots"></div>
        <canvas class="hud-map" id="hud-map" width="200" height="200"></canvas>
        <div class="hud-bars" id="hud-bars"></div>
        <div class="hud-dmg" id="hud-dmg"></div>
        <div class="hud-flash" id="hud-flash"></div>
        <div class="hud-lock" id="hud-lock">
          <div class="lock-vignette" id="lock-vignette"></div>
          <div class="lock-banner" data-i18n="missileLock"></div>
          <div class="lock-arrow" id="lock-arrow"></div>
        </div>
      </section>

      <section id="screen-pause" class="screen screen-dim hidden">
        <div class="panel panel-narrow">
          <h2 data-i18n="paused">Paused</h2>
          <div class="stack">
            <button id="btn-resume" class="btn btn-big" data-i18n="resume">Resume</button>
            <button id="btn-pause-howto" class="btn" data-i18n="howto">How to play</button>
            <button id="btn-restart" class="btn" data-i18n="restartRace">Restart race</button>
            <button id="btn-quit" class="btn" data-i18n="backToBoats">Back to boats</button>
            <button id="btn-menu" class="btn" data-i18n="mainMenu">Main menu</button>
          </div>
        </div>
      </section>

      <section id="screen-results" class="screen screen-dim hidden">
        <div class="panel">
          <h2 id="results-title">Race over</h2>
          <ol class="standings" id="standings"></ol>
          <div class="row">
            <button id="btn-again" class="btn btn-big" data-i18n="raceAgain">Race again</button>
            <button id="btn-change" class="btn" data-i18n="changeBoat">Change boat</button>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
