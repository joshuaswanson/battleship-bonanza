name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check translations, course clearance and turns after transformations
        run: node tools/checks/all.mjs i18n,clearline,afterturn
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - dev: "bay,jungle,frozen,volcano"
            prod: "bay,jungle,frozen"
          - dev: "alps,venice,midway,canyon"
            prod: "volcano,alps"
          - dev: "docks,tuebingen,ctf:bay,ctf:fjord"
            prod: "venice,midway"
          - dev: "ctf:lagoon,ctf:harbor,cp:lagoon"
            prod: "canyon,docks"
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the dev server
        run: npx vite --port 5288 > /tmp/vite.log 2>&1 &
      - run: for i in $(seq 60); do curl -sf http://localhost:5288/ > /dev/null && break; sleep 1; done
      - name: Race on every course
        run: node tools/checks/smoke.mjs "${{ matrix.dev }}"
      - run: npm run build
      - name: Start the production preview
        run: npx vite preview --port 5291 > /tmp/preview.log 2>&1 &
      - run: for i in $(seq 60); do curl -sf http://localhost:5291/battleship-bonanza/ > /dev/null && break; sleep 1; done
      - name: Start a race from the menus on every course
        run: node tools/checks/prodsmoke.mjs "${{ matrix.prod }}"
        env:
          BB_URL: http://localhost:5291/battleship-bonanza/

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
